    <title>Apply — Study in Italy without an agency</title>
    <meta name="description" content="Get the exact document list for Italian universities, have AI check your documents, and apply without paying an agency." />

    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('applyuni_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
